<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Groupes</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; }
        .navbar-brand-custom { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .card { border: none; border-radius: 12px; }
        .btn-gradient { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border: none; color: white; }
        .btn-gradient:hover { opacity: 0.9; color: white; }
        .page-header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 2rem; border-radius: 0 0 20px 20px; margin-bottom: 2rem; }
        .table th { font-weight: 600; }
        .nav-active { border-bottom: 2px solid white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-brand-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-person-lines-fill"></i> Contacts App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" th:href="@{/}">Accueil</a>
                    <a class="nav-link" th:href="@{/contacts}">Contacts</a>
                    <a class="nav-link nav-active" th:href="@{/groupes}">Groupes</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
            <h2><i class="bi bi-collection"></i> Groupes</h2>
            <a th:href="@{/groupes/add}" class="btn btn-gradient"><i class="bi bi-plus-lg"></i> Nouveau Groupe</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(groupes)}" class="text-center py-5">
                    <i class="bi bi-collection display-1 text-muted"></i>
                    <p class="mt-3 fs-5 text-muted">Aucun groupe</p>
                </div>
                <div th:unless="${#lists.isEmpty(groupes)}" class="row g-3">
                    <div class="col-md-4" th:each="groupe : ${groupes}">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${groupe.nom}"></h5>
                                <p class="card-text text-muted" th:text="${groupe.description != null ? groupe.description : 'Aucune description'}"></p>
                            </div>
                            <div class="card-footer bg-white d-flex gap-2">
                                <a th:href="@{/contacts(groupeId=${groupe.id})}" class="btn btn-sm btn-outline-success"><i class="bi bi-people"></i> Voir contacts</a>
                                <a th:href="@{/groupes/edit/{id}(id=${groupe.id})}" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
                                <form th:action="@{/groupes/delete/{id}(id=${groupe.id})}" method="post" style="display:inline" onsubmit="return confirm('Supprimer ce groupe?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-4 text-muted"><p>Spring MVC - Thymeleaf | Contacts App</p></footer>
    <script th:src="@{/webjars/bootstrap/5.2.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
