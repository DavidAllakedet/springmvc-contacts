<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Contacts</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; }
        .navbar-brand-custom { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .card { border: none; border-radius: 12px; }
        .btn-gradient { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border: none; color: white; }
        .btn-gradient:hover { opacity: 0.9; color: white; }
        .page-header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 2rem; border-radius: 0 0 20px 20px; margin-bottom: 2rem; }
        .table th { font-weight: 600; }
        .contact-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-brand-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-person-lines-fill"></i> Contacts App</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/}">Accueil</a>
                <a class="nav-link active" th:href="@{/contacts}">Contacts</a>
                <a class="nav-link" th:href="@{/groupes}">Groupes</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
            <h2><i class="bi bi-people"></i> Contacts</h2>
            <a th:href="@{/contacts/add}" class="btn btn-gradient"><i class="bi bi-plus-lg"></i> Nouveau Contact</a>
        </div>

        <div th:if="${filterGroupe != null}" class="alert alert-info">
            Filtre par groupe active
            <a th:href="@{/contacts}" class="float-end">Supprimer le filtre</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div th:if="${#lists.isEmpty(contacts)}" class="text-center py-5">
                    <i class="bi bi-inbox display-1 text-muted"></i>
                    <p class="mt-3 fs-5 text-muted">Aucun contact trouve</p>
                </div>
                <div th:unless="${#lists.isEmpty(contacts)}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr><th>#</th><th>Nom</th><th>Email</th><th>Telephone</th><th>Adresse</th><th>Groupe</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="contact : ${contacts}">
                                <td th:text="${contact.id}"></td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="contact-avatar bg-success me-2" th:text="${#strings.substring(contact.prenom,0,1) + #strings.substring(contact.nom,0,1)}"></div>
                                        <span class="fw-semibold" th:text="${contact.nom + ' ' + contact.prenom}"></span>
                                    </div>
                                </td>
                                <td th:text="${contact.email}"></td>
                                <td th:text="${contact.telephone}"></td>
                                <td class="text-muted" th:text="${contact.adresse}"></td>
                                <td><span class="badge bg-success" th:text="${contact.groupeNom != null ? contact.groupeNom : 'Aucun'}"></span></td>
                                <td>
                                    <a th:href="@{/contacts/edit/{id}(id=${contact.id})}" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
                                    <a th:href="@{/contacts/delete/{id}(id=${contact.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Supprimer?')"><i class="bi bi-trash"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-4 text-muted"><p>Spring MVC - Thymeleaf | Contacts App</p></footer>
    <script th:src="@{/webjars/bootstrap/5.2.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
