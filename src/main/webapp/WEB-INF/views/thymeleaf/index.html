<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle : 'Contacts App'}">Contacts App</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; }
        .navbar-brand-custom { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .card { border: none; border-radius: 12px; }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .btn-gradient { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border: none; color: white; }
        .btn-gradient:hover { opacity: 0.9; color: white; }
        .page-header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 2rem; border-radius: 0 0 20px 20px; margin-bottom: 2rem; }
        .table th { font-weight: 600; color: #495057; background: #f8f9fa; }
        .contact-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .nav-active { border-bottom: 2px solid white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-brand-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-person-lines-fill"></i> Contacts App
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link nav-active" th:href="@{/}">Accueil</a>
                    <a class="nav-link" th:href="@{/contacts}">Contacts</a>
                    <a class="nav-link" th:href="@{/groupes}">Groupes</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="page-header text-center">
            <h1><i class="bi bi-speedometer2"></i> Tableau de bord</h1>
            <p>Gerez vos contacts facilement</p>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card stat-card shadow-sm bg-primary text-white">
                    <div class="card-body d-flex align-items-center">
                        <div class="fs-1 me-3"><i class="bi bi-people"></i></div>
                        <div><div class="fs-2 fw-bold" th:text="${totalContacts}">0</div><div>Contacts</div></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card shadow-sm bg-success text-white">
                    <div class="card-body d-flex align-items-center">
                        <div class="fs-1 me-3"><i class="bi bi-collection"></i></div>
                        <div><div class="fs-2 fw-bold" th:text="${totalGroupes}">0</div><div>Groupes</div></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card shadow-sm bg-info text-white">
                    <div class="card-body d-flex align-items-center">
                        <div class="fs-1 me-3"><i class="bi bi-person-plus"></i></div>
                        <div><div class="fs-2 fw-bold">+</div><div>Ajouter</div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-person-lines-fill"></i> Derniers contacts</h5>
                <a th:href="@{/contacts}" class="btn btn-sm btn-outline-success">Voir tout</a>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(contacts)}" class="text-center py-4">
                    <i class="bi bi-inbox display-1 text-muted"></i>
                    <p class="mt-2 text-muted">Aucun contact pour le moment</p>
                </div>
                <div th:unless="${#lists.isEmpty(contacts)}" class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr><th>Nom</th><th>Email</th><th>Telephone</th><th>Groupe</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="contact : ${contacts}" th:if="${contactsStat.index < 5}">
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="contact-avatar bg-success me-2" th:text="${#strings.substring(contact.prenom,0,1) + #strings.substring(contact.nom,0,1)}"></div>
                                        <div>
                                            <div class="fw-semibold" th:text="${contact.nom + ' ' + contact.prenom}"></div>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${contact.email}"></td>
                                <td th:text="${contact.telephone}"></td>
                                <td><span class="badge bg-light text-dark" th:text="${contact.groupeNom != null ? contact.groupeNom : 'Sans groupe'}"></span></td>
                                <td>
                                    <a th:href="@{/contacts/edit/{id}(id=${contact.id})}" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
                                    <form th:action="@{/contacts/delete/{id}(id=${contact.id})}" method="post" style="display:inline" onsubmit="return confirm('Supprimer?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-4 text-muted">
        <p>Spring MVC - Thymeleaf | Contacts App</p>
    </footer>

    <script th:src="@{/webjars/bootstrap/5.2.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
