<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter / Modifier un Contact</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; }
        .navbar-brand-custom { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .card { border: none; border-radius: 12px; }
        .btn-gradient { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border: none; color: white; }
        .btn-gradient:hover { opacity: 0.9; color: white; }
        .page-header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 2rem; border-radius: 0 0 20px 20px; margin-bottom: 2rem; }
        .form-label { font-weight: 500; }
        .nav-active { border-bottom: 2px solid white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-brand-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-person-lines-fill"></i> Contacts App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" th:href="@{/}">Accueil</a>
                    <a class="nav-link nav-active" th:href="@{/contacts}">Contacts</a>
                    <a class="nav-link" th:href="@{/groupes}">Groupes</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div th:if="${nomError}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${nomError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="page-header text-center">
            <h1><i class="bi bi-person-plus"></i> <span th:text="${contact.id != null ? 'Modifier' : 'Ajouter'}">Ajouter</span> un Contact</h1>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="${contact.id != null} ? @{/contacts/update} : @{/contacts/save}" method="post">
                            <input type="hidden" th:if="${contact.id != null}" name="id" th:value="${contact.id}">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nom *</label>
                                    <input type="text" class="form-control" name="nom" th:value="${contact.nom}" required placeholder="Nom de famille" maxlength="100">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Prenom</label>
                                    <input type="text" class="form-control" name="prenom" th:value="${contact.prenom}" placeholder="Prenom" maxlength="100">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" name="email" th:value="${contact.email}" placeholder="email@exemple.com" maxlength="200">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Telephone</label>
                                    <input type="tel" class="form-control" name="telephone" th:value="${contact.telephone}" placeholder="+221 77 000 00 00" maxlength="20">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Adresse</label>
                                <textarea class="form-control" name="adresse" rows="2" th:text="${contact.adresse}" placeholder="Adresse complete"></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Groupe</label>
                                <select class="form-select" name="groupeId">
                                    <option value="">-- Choisir un groupe --</option>
                                    <option th:each="groupe : ${groupes}" th:value="${groupe.id}" th:text="${groupe.nom}" th:selected="${contact.groupeId != null and contact.groupeId == groupe.id}"></option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-gradient"><i class="bi bi-check-lg"></i> Enregistrer</button>
                                <a th:href="@{/contacts}" class="btn btn-outline-secondary"><i class="bi bi-x-lg"></i> Annuler</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-4 text-muted"><p>Spring MVC - Thymeleaf | Contacts App</p></footer>
    <script th:src="@{/webjars/bootstrap/5.2.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
